name: Auto Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Resonate APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Dist to App Android Assets
        run: |
          mkdir -p App/app/src/main/assets/dist
          cp -r dist/* App/app/src/main/assets/dist/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          cd App
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date +%s%3N)
          VERSION_CODE=$(git rev-list --count HEAD)
          cd App
          ./gradlew assembleDebug -PgitCommitSha=$SHORT_SHA -PbuildTimeMillis=$BUILD_TIME -PversionCode=$VERSION_CODE --no-daemon

      - name: Prepare APK Artifacts
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          VERSION_CODE=$(git rev-list --count HEAD)

          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT

          # Find generated APK inside App/ and copy to release name
          APK_PATH=$(find App/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" Resonate-v1.0.0.apk
          ls -lh Resonate-v1.0.0.apk

          # Generate lightweight version.json release metadata
          cat <<EOF > version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "1.0.0",
            "commitSha": "$SHORT_SHA",
            "commitMessage": "$COMMIT_MSG",
            "buildDate": "$BUILD_DATE",
            "downloadUrl": "https://github.com/ayushmanchakraborty254-create/Resonate/releases/download/latest/Resonate-v1.0.0.apk"
          }
          EOF

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-v1.0.0-APK
          path: Resonate-v1.0.0.apk
          retention-days: 30

      - name: Remove Old Release Assets
        run: |
          gh release delete-asset latest Resonate-v1.0.0.apk --yes || true
          gh release delete-asset latest version.json --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Resonate Auto-Build (${{ steps.vars.outputs.sha }})"
          body: |
            ## 🎵 Resonate Continuous Delivery Build
            - **Commit:** `${{ steps.vars.outputs.sha }}`
            - **Message:** ${{ steps.vars.outputs.msg }}
            - **Build Timestamp:** ${{ steps.vars.outputs.date }}

            Direct Android APK installer compiled automatically on every push to `main` without Android Studio!
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Resonate-v1.0.0.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
